version: '3.8'

services:
  # ── MySQL Database ───────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: idealab_db
    restart: always
    environment:
      MYSQL_DATABASE: idealab_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: idealab
      MYSQL_PASSWORD: idealabpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  # ── Redis Cache ──────────────────────────────────────────
  redis:
    image: redis:latest
    container_name: idealab_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ── Django Backend ───────────────────────────────────────
  backend:
    build: .
    container_name: idealab_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=idealab_db
      - DB_USER=idealab
      - DB_PASSWORD=idealabpass
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  # ── Celery Worker ────────────────────────────────────────
  celery:
    build: .
    container_name: idealab_celery
    restart: always
    command: celery -A config worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=idealab_db
      - DB_USER=idealab
      - DB_PASSWORD=idealabpass
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  # ── Nginx Reverse Proxy ──────────────────────────────────
  nginx:
    image: nginx:latest
    container_name: idealab_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume:
